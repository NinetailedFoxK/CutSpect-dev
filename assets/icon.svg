<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none">
  <title>镜谱 CutSpect Logo</title>
  <desc>由取景框、分析曲线与三个关键节点组成的拉片分析软件标志。</desc>

  <defs>
    <linearGradient id="surface" x1="202" y1="164" x2="1054" y2="1045" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171A22"/>
      <stop offset="0.52" stop-color="#10131A"/>
      <stop offset="1" stop-color="#151820"/>
    </linearGradient>

    <radialGradient id="surfaceGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(630 525) rotate(90) scale(620 650)">
      <stop stop-color="#202431" stop-opacity="0.42"/>
      <stop offset="0.62" stop-color="#11141B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0.3"/>
    </radialGradient>

    <linearGradient id="frame" x1="260" y1="280" x2="1000" y2="926" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#F3F4F7"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="curve" x1="120" y1="620" x2="1136" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B45F4"/>
      <stop offset="0.28" stop-color="#815AFF"/>
      <stop offset="0.58" stop-color="#7046F5"/>
      <stop offset="0.82" stop-color="#835BFF"/>
      <stop offset="1" stop-color="#6E46F7"/>
    </linearGradient>

    <linearGradient id="node" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBE32"/>
      <stop offset="1" stop-color="#FF9E0D"/>
    </linearGradient>

    <clipPath id="iconClip">
      <rect x="118" y="138" width="1018" height="946" rx="160"/>
    </clipPath>

    <filter id="surfaceShadow" x="78" y="98" width="1098" height="1026" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.32"/>
    </filter>

    <filter id="curveGlow" x="80" y="360" width="1096" height="450" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.18  0 0 0 0 1  0 0 0 0.42 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>

    <filter id="nodeShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- 透明画布；圆角底板之外保持透明，适合直接导出应用图标。 -->
  <g filter="url(#surfaceShadow)">
    <rect x="118" y="138" width="1018" height="946" rx="160" fill="url(#surface)"/>
    <rect x="118" y="138" width="1018" height="946" rx="160" fill="url(#surfaceGlow)"/>
    <rect x="119" y="139" width="1016" height="944" rx="159" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="2"/>
  </g>

  <g clip-path="url(#iconClip)">
    <!-- 拉片曲线。曲线越过底板两侧，由圆角底板自然裁切。 -->
    <path
      d="M 104 629
         C 238 629, 302 417, 458 417
         C 619 417, 562 748, 773 748
         C 930 748, 985 519, 1152 519"
      stroke="#4E2BCB"
      stroke-opacity="0.45"
      stroke-width="42"
      stroke-linecap="round"
      filter="url(#curveGlow)"
    />
    <path
      d="M 104 629
         C 238 629, 302 417, 458 417
         C 619 417, 562 748, 773 748
         C 930 748, 985 519, 1152 519"
      stroke="url(#curve)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 三个关键分析节点。 -->
    <g filter="url(#nodeShadow)">
      <rect x="432" y="391" width="52" height="52" rx="7" transform="rotate(45 458 417)" fill="url(#node)"/>
      <rect x="747" y="722" width="52" height="52" rx="7" transform="rotate(45 773 748)" fill="url(#node)"/>
      <rect x="953" y="587" width="52" height="52" rx="7" transform="rotate(45 979 613)" fill="url(#node)"/>
    </g>
  </g>

  <!-- 四角取景框。采用独立路径，中心留口避免与曲线产生视觉拥挤。 -->
  <g stroke="url(#frame)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 540 290 H 335 C 293 290 260 323 260 365 V 492"/>
    <path d="M 714 290 H 919 C 961 290 994 323 994 365 V 492"/>
    <path d="M 260 701 V 850 C 260 892 293 918 335 918 H 540"/>
    <path d="M 714 918 H 919 C 961 918 994 885 994 843 V 701"/>
  </g>
</svg>
