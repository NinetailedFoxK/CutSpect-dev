<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      安全基线 CSP（规格 12.5）：
      - default-src 'self'：默认只允许同源资源。
      - media-src 显式放行 laipian-media: 自定义协议（规格 12.5 受控媒体读取）与 blob:。
      - img-src 放行 data:/blob:（缩略图占位）与 laipian-media:。
      - connect-src 生产环境只有 'self'。Vite 的 5173 仅在 `vite serve` 时注入，不进入安装包。
      - script-src 仅 'self'：生产 file:// 与开发 dev server 同源均被覆盖，
        contextIsolation + sandbox 下渲染层无 Node 能力，禁止任意远程脚本。
      - style-src 'unsafe-inline'：React 内联样式与 vite 开发期注入样式所需。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: laipian-media:; media-src 'self' blob: laipian-media:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>CutSpect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
